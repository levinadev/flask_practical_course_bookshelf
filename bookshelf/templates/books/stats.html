{% extends "base.html" %}
{% block title %}Статистика{% endblock %}
{% block content %}
<h1>Статистика</h1>
<div class="grid stats">
  <div class="card stat"><span class="number">{{ total }}</span><span>всего книг</span></div>
  {% for key, label in statuses.items() %}
    <div class="card stat"><span class="number">{{ counts[key] }}</span><span>{{ label|lower }}</span></div>
  {% endfor %}
  <div class="card stat"><span class="number">{{ avg_rating if avg_rating else '-' }}</span><span>средняя оценка</span></div>
</div>
{% endblock %}
