{% extends "base.html" %}
{% block title %}Регистрация{% endblock %}
{% block content %}
<section class="card form-card">
  <h1>Регистрация</h1>
  <form method="post">
    <label>Имя пользователя
      <input name="username" value="{{ request.form['username'] }}" required>
    </label>
    <label>Пароль
      <input type="password" name="password" minlength="6" required>
    </label>
    <button type="submit">Создать аккаунт</button>
  </form>
  <p class="muted">Уже есть аккаунт? <a href="{{ url_for('auth.login') }}">Войдите</a></p>
</section>
{% endblock %}
