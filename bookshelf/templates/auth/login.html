{% extends "base.html" %}
{% block title %}Вход{% endblock %}
{% block content %}
<section class="card form-card">
  <h1>Вход</h1>
  <form method="post">
    <label>Имя пользователя
      <input name="username" value="{{ request.form['username'] }}" required>
    </label>
    <label>Пароль
      <input type="password" name="password" required>
    </label>
    <button type="submit">Войти</button>
  </form>
  <p class="muted">Нет аккаунта? <a href="{{ url_for('auth.register') }}">Зарегистрируйтесь</a></p>
</section>
{% endblock %}
